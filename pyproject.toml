[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vitadock-garmin-sync"
version = "0.1.0"
description = "Sync Medisana VitaDock+ measurements to Garmin Connect"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "garminconnect>=0.3.20"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
vitadock-garmin-sync = "vitadock_garmin_sync.__main__:main"

[tool.setuptools]
packages = ["vitadock_garmin_sync"]
